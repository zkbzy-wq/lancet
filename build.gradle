// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply plugin: 'base'
buildscript {
    ext {
        Properties properties = new Properties()
        File localPropsFile = project.rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            properties.load(localPropsFile.newDataInputStream())
        }

        ele = "true" == properties.getProperty("ele")

        // GitHub Packages publishing credentials (for non-ele builds)
        // You can set these in local.properties (recommended) or rely on
        // environment variables GITHUB_ACTOR / GITHUB_TOKEN.
        gprUser = properties.getProperty('gpr.user') ?: System.getenv("GITHUB_ACTOR")
        gprKey = properties.getProperty('gpr.key') ?: System.getenv("GITHUB_TOKEN")
        // 仓库名默认使用当前项目名，你也可以在 local.properties 里通过 gpr.repo 覆盖
        gprRepo = properties.getProperty('gpr.repo') ?: rootProject.name
        // 你自己的 Maven 坐标前缀（groupId），避免再用原来的 me.ele
        // 注意：groupId 必须是合法的 Java 包名，不能包含连字符 -
        lancet_group = 'io.github.zkbzywq.lancet'
        // 你的 fork 使用新的版本号，避免和上游/历史发布冲突
        lancet_version = '1.0.7'

        asm_version = '5.1'
        //android_tools_version = '2.4.0-alpha6'
        android_tools_version = '3.3.2'
        guava_version = '24.0'
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        if (ele) {
            classpath 'me.ele:eradle:1.7.0'
        }
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

subprojects { pro ->

    repositories {
        mavenCentral()
        google()
    }

    if (pro.name == 'sample-test')return

    version = lancet_version
    group = lancet_group

    // 禁用严格的 Javadoc Doclint，避免因为缺少注释导致构建失败（JDK 8+ 默认很严格）
    tasks.withType(Javadoc).configureEach { javadocTask ->
        javadocTask.options.addStringOption('Xdoclint:none', '-quiet')
    }

    if (ele) {
        apply plugin: 'eradle'
        modifyPom {
            project {
                groupId lancet_group
                artifactId pro.name
                version lancet_version
                packaging 'jar'
            }
        }
        extraArchive {
            sources = true
        }
    } else {
        // 使用标准 maven-publish 插件发布到 GitHub Packages
        apply plugin: 'maven-publish'
        afterEvaluate {
            task sourcesJar(type: Jar) {
                from sourceSets.main.java.srcDirs
                archiveClassifier = 'sources'
            }

            task javadocJar(type: Jar, dependsOn: javadoc) {
                archiveClassifier = 'javadoc'
                from javadoc.destinationDir
            }

            artifacts {
                archives sourcesJar
                archives javadocJar
            }
            publishing {
                publications {
                    mavenJava(MavenPublication) {
                        from components.java

                        groupId = lancet_group
                        artifactId = pro.name
                        version = lancet_version

                        artifact sourcesJar
                        artifact javadocJar

                        pom {
                            packaging = 'jar'
                            name = pro.name
                            description = 'Lancet AOP library'
                            url = "https://github.com/${gprUser}/${gprRepo}"
                            licenses {
                                license {
                                    name = 'The Apache Software License, Version 2.0'
                                    url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                                }
                            }
                            developers {
                                developer {
                                    id = 'dieyidezui'
                                    name = '耿万鹏'
                                    email = 'dieyidezui@gmail.com'
                                }
                                developer {
                                    id = 'jude95'
                                    name = '朱晨曦'
                                    email = '973829691@qq.com'
                                }
                            }
                        }
                    }
                }

                repositories {
                    maven {
                        name = "GitHubPackages"
                        url = uri("https://maven.pkg.github.com/${gprUser}/${gprRepo}")
                        credentials {
                            username = gprUser
                            password = gprKey
                        }
                    }
                }
            }
        }
    }

}

task uploadAll { task ->

    task.group = 'upload'
    gradle.projectsEvaluated {
        task.dependsOn project.tasks.clean
        task.dependsOn project.tasks.build

        project.tasks.build.mustRunAfter project.tasks.clean

        project.subprojects {
            if (it.name != 'sample-test') {
                    Task upload = !ele ? it.tasks.publish : it.tasks.uploadArchives;
                task.dependsOn upload
                upload.mustRunAfter project.tasks.build
            }
        }
    }
}
